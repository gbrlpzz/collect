[auth]
enabled = true
site_url = "https://collect-tawny.vercel.app"
additional_redirect_urls = ["https://collect-tawny.vercel.app"]
# Anyone may create a contributor account. An account on its own shows
# nothing: projects appear only where a membership exists, and administrator
# rights are granted only to allow-listed addresses. Sign-up must stay open
# for provider sign-in to work at all — a first Google or Apple sign-in is a
# sign-up.
enable_signup = true

# Identity providers. They carry no email, so admitting people never depends
# on a mail quota. Credentials live in the deployment, never in the repository.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_GOOGLE_SECRET)"
skip_nonce_check = false

[auth.external.apple]
enabled = true
client_id = "env(SUPABASE_AUTH_APPLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_APPLE_SECRET)"

[auth.email]
otp_length = 6
otp_expiry = 600
double_confirm_changes = true
enable_confirmations = true

[auth.email.template.invite]
subject = "You're invited to collect"
content_path = "./supabase/templates/invite.html"

[auth.email.template.magic_link]
subject = "Your collect sign-in link"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirm your email address"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your collect password"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "Confirm your new email address"
content_path = "./supabase/templates/email_change.html"

[auth.email.template.reauthentication]
subject = "Your collect verification code"
content_path = "./supabase/templates/reauthentication.html"
