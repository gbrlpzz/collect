<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Two installable identities share this shell: ?role=admin installs the
      // black "collect Admin" PWA (operations console); the default installs
      // the white contributor PWA. The manifest is chosen before first paint
      // so Add to Home Screen captures the right identity.
      (function () {
        var role = new URLSearchParams(window.location.search).get("role");
        var admin = role === "admin";
        var manifest = document.createElement("link");
        manifest.rel = "manifest";
        manifest.href = admin ? "/manifest-admin.webmanifest" : "/manifest.webmanifest";
        document.head.appendChild(manifest);
        var theme = document.createElement("meta");
        theme.name = "theme-color";
        theme.content = admin ? "#1d1d1f" : "#f2f2f7";
        document.head.appendChild(theme);
        var touch = document.createElement("link");
        touch.rel = "apple-touch-icon";
        touch.href = admin ? "/apple-touch-icon-admin.png" : "/apple-touch-icon.png";
        document.head.appendChild(touch);
        var title = document.createElement("meta");
        title.name = "apple-mobile-web-app-title";
        title.content = admin ? "collect Admin" : "collect";
        document.head.appendChild(title);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="collect" />
    <meta name="description" content="Collect structured field observations, even when the network disappears." />
    <title>collect — fieldwork, ready offline</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
